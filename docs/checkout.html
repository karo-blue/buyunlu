<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f6fa"><title>广告卡购买 · 步云录</title><link rel="stylesheet" href="theme.css?v=1.0.17"><link rel="stylesheet" href="store.css?v=1.0.17"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src https://xiaoma51.com; base-uri 'none'; form-action 'none'"></head>
<body><header class="site-nav"><a href="./">步云录 <span>在线版</span></a><a href="./">返回游戏</a></header>
<main class="checkout"><h1 id="checkout-title">购买广告卡</h1><p class="intro">¥0.10 / 张 · 最低 ¥1 · 付款后发至下方账号</p>
<div class="checkout-layout"><section class="panel"><h2>选择购买金额</h2>
<div class="amount-presets" aria-label="快捷选择金额"><button type="button" data-yuan="1" aria-pressed="true"><strong>¥1</strong><span>10 张</span></button><button type="button" data-yuan="6" aria-pressed="false"><strong>¥6</strong><span>60 张</span></button><button type="button" data-yuan="30" aria-pressed="false"><strong>¥30</strong><span>300 张</span></button></div>
<div class="purchase-amount"><label for="purchase-yuan">自定义金额（元）</label><input id="purchase-yuan" type="text" inputmode="numeric" pattern="[1-9][0-9]*" value="1" maxlength="3" aria-describedby="amount-help amount-error"><small id="amount-help">1～100 元，仅限整数；每 1 元到账 10 张。</small><p id="amount-error" class="payment-error" role="alert"></p></div>
<dl class="account-summary"><div><dt><a class="switch-account" href="./?account=1" aria-label="切换到账账号">到账账号 ↗</a></dt><dd id="purchase-account">正在确认…</dd></div><div><dt>当前余额</dt><dd id="card-balance">—</dd></div></dl>
<p class="usage-note">每张：读档1次，或本局晋升+3个百分点（跨年、晋升保留，重开清零）。概率最高100%，仍须达标。</p></section>
<aside class="panel order-summary"><dl class="purchase-summary"><div><dt>到账广告卡</dt><dd id="purchase-cards" class="card-count" aria-live="polite">10 张</dd></div><div><dt>实付金额</dt><dd class="total" id="order-total">¥1.00</dd></div></dl><span id="order-amount" hidden>¥1.00</span>
<fieldset disabled><legend class="sr-only">支付方式</legend><label><input id="alipay-channel" type="radio" name="channel" value="alipay" checked>支付宝 <small id="alipay-state">正在检查</small></label></fieldset>
<p id="payment-notice" class="notice" role="status" aria-live="polite">正在检查支付服务，尚未创建订单。</p><p id="payment-error" class="payment-error" role="alert"></p>
<div id="purchase-terms"><label class="purchase-consent" for="purchase-agree"><input id="purchase-agree" type="checkbox"><span>我已核对账号和数量：虚拟道具正常到账后，不支持无理由仅退款。</span></label><p class="refund-note">未到账、重复扣款可核查；法定售后权利不受影响。</p></div>
<a id="payment-login" class="primary" href="./?checkout=1" hidden>登录或注册后购买</a><button id="pay-button" class="primary" type="button" disabled>正在检查支付</button>
<button id="check-payment" class="secondary" type="button" hidden>我已支付，查询结果</button><a id="back-to-game" class="primary" href="./" hidden>返回游戏使用广告卡</a><button id="new-order" class="secondary" type="button" hidden>重新购买</button>
</aside></div></main><footer>步云录 · 虚构成长模拟</footer><script src="site.js?v=1.0.17"></script><script src="commerce-api.js?v=1.0.17"></script><script src="checkout.js?v=1.0.17"></script></body></html>
