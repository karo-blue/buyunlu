<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#eef3ff"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://xiaoma51.com; worker-src 'self'; manifest-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="步云录"><title>步云录 · 网页版</title><link rel="manifest" href="manifest.webmanifest?v=1.0.14"><link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=1.0.14"><link rel="stylesheet" href="style.css?v=1.0.14"><link rel="stylesheet" href="commerce.css?v=1.0.14"></head><body><main id="app" aria-label="步云录游戏"></main><div id="toast" role="status" aria-live="polite"></div><noscript>请启用 JavaScript 以运行离线游戏。</noscript><section id="commerce-account" class="commerce-mask" role="dialog" aria-modal="true" aria-labelledby="commerce-title" hidden>
  <div class="commerce-card">
    <button id="commerce-close" class="commerce-close" type="button" aria-label="关闭购卡账号窗口">关闭</button>
    <h2 id="commerce-title">登录购卡账号</h2><p>登录后购买和使用广告卡，余额随账号保存。</p>
    <p id="commerce-current" hidden></p><button id="commerce-logout" type="button" hidden>退出当前购卡账号</button>
    <div id="commerce-login-modes" class="commerce-login-modes" aria-label="登录方式"><button id="commerce-mode-password" type="button" aria-pressed="true">密码登录</button><button id="commerce-mode-code" type="button" aria-pressed="false">验证码登录</button></div>
    <form id="commerce-login-form">
      <label id="commerce-identifier-label" for="commerce-username">用户名或邮箱</label><input id="commerce-username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="1" maxlength="254" aria-describedby="commerce-identifier-help" required>
      <small id="commerce-identifier-help">可使用用户名或已验证邮箱登录</small>
      <div id="commerce-email-field" hidden><label for="commerce-email">验证邮箱</label><input id="commerce-email" type="email" autocomplete="email" maxlength="254" disabled></div>
      <label for="commerce-password">密码</label><input id="commerce-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required><small>密码请设为 8～20 位，并妥善保存。</small>
      <button id="commerce-submit" class="commerce-primary" type="submit">登录</button><button id="commerce-toggle" type="button">没有账号？注册</button>
    </form>
    <form id="commerce-code-login-form" hidden>
      <label for="commerce-login-email">已注册邮箱</label><input id="commerce-login-email" type="email" autocomplete="email" autocapitalize="none" spellcheck="false" maxlength="254" required>
      <small>使用账号已验证的邮箱，无需输入密码。</small>
      <label for="commerce-login-code">邮箱验证码</label><div class="commerce-code-row"><input id="commerce-login-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required><button id="commerce-login-send" type="button">发送验证码</button></div>
      <button id="commerce-code-submit" class="commerce-primary" type="submit">验证码登录</button><button id="commerce-code-register" type="button">没有账号？注册</button>
    </form>
    <form id="commerce-verify-form" hidden>
      <label for="commerce-verify-email">验证邮箱</label><input id="commerce-verify-email" type="email" autocomplete="email" maxlength="254" required>
      <button id="commerce-send" type="button">发送验证码</button>
      <label for="commerce-code">邮箱验证码</label><input id="commerce-code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required>
      <button id="commerce-verify-submit" class="commerce-primary" type="submit">验证并继续</button>
    </form>
    <p id="commerce-status" role="status" aria-live="polite"></p><p id="commerce-error" role="alert"></p>
  </div>
</section>
<script src="site.js?v=1.0.14"></script><script src="commerce-api.js?v=1.0.14"></script><script src="commerce-account.js?v=1.0.14"></script><script src="commerce.js?v=1.0.14"></script><script src="runtime.js?v=1.0.14"></script><script src="offline.js?v=1.0.14"></script><script src="game.js?v=1.0.14"></script><script src="pwa.js?v=1.0.14"></script></body></html>
